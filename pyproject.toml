[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dendrometer-stress-index"
version = "0.1.0"
description = "Daily tree water-stress index from point-dendrometer readings: MDS, growth, TWD, irrigation advice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dendro-stress = "dendro_stress.cli:main"

[tool.setuptools]
packages = ["dendro_stress"]

[tool.setuptools.package-data]
dendro_stress = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
